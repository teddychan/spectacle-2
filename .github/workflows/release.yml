name: Release Spectacle 2

# Tagging vX.Y.Z builds, signs (Developer ID + hardened runtime), notarizes, staples and
# publishes Spectacle 2: a GitHub Release on this repo, an EdDSA-signed Sparkle appcast
# committed to this repo (docs/spectacle-2/appcast.xml, served via raw.githubusercontent —
# the marketing site is not involved), and a Homebrew cask bump in teddychan/homebrew-tap.
# Thin caller of the shared reusable workflow (same one clipmenu-2 / the sample app use).
on:
  push:
    tags:
      - 'v*'
  # A verification-only dispatch, the shape dragon-sample-app has had since v6: run the tag gate
  # and the whole build, then stop — signing and publishing nothing. It is the only way to
  # exercise this pipeline from a branch with no tag, which is what a change to the BUILD rather
  # than to the app needs. The §R16 move of Info.plist and AppIcon.icns into App/ is exactly such
  # a change: before this, proving it would have cost a public vX.Y.Z — a version bump, What's New
  # notes, a signed artifact and a Homebrew bump, to demonstrate a directory rename.
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run the gate and build, publish nothing'
        type: boolean
        default: true
      release_tag:
        description: 'Optional: an EXISTING exact vX.Y.Z tag to build. The job checks out that commit rather than the branch head. Leave empty to build this branch.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v6
    secrets: inherit
    with:
      # `inputs` only exists for workflow_dispatch. On a TAG PUSH it is absent, so a bare
      # `${{ inputs.verify_only }}` evaluates to '' and GitHub rejects the whole run with
      # "evaluate reusable workflow inputs … Unexpected value ''" — 0 jobs, no log, and a public
      # tag spent for nothing. dragon-sample-app burned v1.4.1 finding that, and found it late
      # precisely because every verification run had gone through workflow_dispatch: the push
      # path these two lines break is the one path a dispatch never exercises. Guard on the event
      # so a tag push resolves to a literal false.
      verify_only: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only || false }}
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
      # v6's tag gate replaces v5's `VERSION=${TAG##*v}`, which left a value containing no "v"
      # untouched — so a workflow_dispatch arrived with a BRANCH ref and produced VERSION=main.
      # It also accepts only exact `vX.Y.Z`, and requires whats_new_path: the two move together,
      # because passing whats_new_path to v5 fails at startup (v5 does not define the input) and
      # omitting it on v6 fails the gate.
      #
      # The config file FIRST — the version and section checks read that one — then every
      # translation. Spectacle's entries are abstract `L()` keys ("app.whatsNew.changed1"), so the
      # text a user actually reads lives in these .strings and the .swift can sit still through a
      # complete rewrite of the notes. Watching only the .swift would reject that real rewrite and
      # wave through a release whose notes never changed. Needs dragon-release-ci >= v6.2.0, which
      # is what made the input accept a list.
      whats_new_path: >-
        Sources/Spectacle2/WhatsNewConfig.swift
        Sources/Spectacle2/Resources/en.lproj/Localizable.strings
        Sources/Spectacle2/Resources/es.lproj/Localizable.strings
        Sources/Spectacle2/Resources/fr.lproj/Localizable.strings
        Sources/Spectacle2/Resources/ja.lproj/Localizable.strings
        Sources/Spectacle2/Resources/ko.lproj/Localizable.strings
        Sources/Spectacle2/Resources/zh-Hans.lproj/Localizable.strings
        Sources/Spectacle2/Resources/zh-Hant.lproj/Localizable.strings
      build_kind: swiftpm
      app_slug: spectacle-2
      # Self-host the appcast in THIS repo (docs/spectacle-2/appcast.xml) rather than the
      # marketing site — matches SUFeedURL in Info.plist.
      appcast_repo: teddychan/spectacle-2
      # Package.swift stays at the repo root, so the SwiftPM build still runs there. The bundle
      # inputs no longer do: DragonKit CONFORMANCE §R16 puts Info.plist and AppIcon.icns in App/
      # at the repo root, in every Dragon app whatever builds it, so the two directories have
      # come apart and the assembly has to be told about the second one. Repo-root-relative, and
      # new in dragon-release-ci v6.5.0 — before it, the assembly always read the bundle inputs
      # from swiftpm_working_directory, which silently required the plist to sit beside the
      # manifest. This repo pins @v6, which already resolves there.
      swiftpm_working_directory: '.'
      swiftpm_bundle_inputs_directory: App
      swiftpm_product_name: Spectacle2
      swiftpm_app_name_template: 'Spectacle 2'
      swiftpm_sparkle: true
      swiftpm_runner: macos-26
      assert_tag_matches_plist: true
      zip_name_template: 'Spectacle2-{TAG}.zip'
      generate_appcast_glob: swiftpm
      bot_name: Spectacle 2 Release Bot
      release_title_prefix: ''
